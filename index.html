<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabungan Bersama</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. HALAMAN LOGIN -->
  <div id="login-screen" class="card">
    <h2>🔒 Masuk Tabungan Bersama</h2>
    <p>Pilih akun dan masukkan PIN untuk melanjutkan.</p>
    <div class="form-group">
      <label for="username">Pengguna:</label>
      <select id="username">
        <option value="Adam">Adam</option>
        <option value="Nadine">Nadine</option>
      </select>
    </div>
    <div class="form-group">
      <label for="password">PIN / Password:</label>
      <input type="password" id="password" placeholder="Masukkan PIN (default: 1234)">
    </div>
    <button id="btn-login" onclick="login()">Masuk</button>
    <p id="login-error" class="error-msg"></p>
  </div>

  <!-- 2. DASHBOARD UTAMA (TERSEMBUNYI SEBELUM LOGIN) -->
  <div id="dashboard-screen" class="dashboard hidden">
    
    <header>
      <h1>💰 Tabungan Kita</h1>
      <p>Halo, <b id="user-display"></b>! | <a href="#" onclick="logout()">Keluar</a></p>
    </header>

    <!-- Ringkasan Saldo -->
    <div class="summary-grid">
      <div class="card stat-card">
        <h3>Total Tabungan</h3>
        <p class="amount" id="total-saldo">Rp 0</p>
      </div>
      <div class="card stat-card">
        <h3>Setoran Minggu Ini</h3>
        <p class="amount" id="total-minggu">Rp 0</p>
      </div>
    </div>

    <!-- Progress Target -->
    <div class="card">
      <h3>🎯 Target Bersama: Rp <span id="target-display">Rp.500.000</span></h3>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
      </div>
      <p id="progress-text" class="text-subtle">0% tercapai</p>
    </div>

    <!-- Form Setor Tabungan -->
    <div class="card">
      <h3>➕ Setor Uang Tabungan</h3>
      <form id="form-setor" onsubmit="setorUang(event)">
        <div class="form-group">
          <label for="nominal">Nominal (Rp):</label>
          <input type="number" id="nominal" min="1000" placeholder="Contoh: 50000" required>
        </div>
        <div class="form-group">
          <label for="catatan">Catatan (Opsional):</label>
          <input type="text" id="catatan" placeholder="Contoh: Tabungan mingguan">
        </div>
        <button type="submit">Simpan Setoran</button>
      </form>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="card">
      <h3>📜 Riwayat Setoran</h3>
      <ul id="history-list" class="history-list">
        <li class="empty-state">Belum ada transaksi.</li>
      </ul>
    </div>

  </div>

  <!-- Firebase Web SDK (v9/v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
